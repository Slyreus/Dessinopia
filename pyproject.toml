[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dessinopia"
version = "1.0.0b4"
description = "Convertisseur et assistant de peinture pour Heartopia"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Slyreus" }]
license = { text = "AGPL-3.0-only" }
dependencies = [
  "PySide6>=6.11,<6.12",
  "numpy>=2.5,<2.6",
  "opencv-python-headless>=5.0,<5.1",
  "Pillow>=11.3,<13",
  "mss>=10,<11",
]

[project.optional-dependencies]
build = [
  "nuitka>=4.1,<4.2",
  "ordered-set>=4.1",
  "zstandard>=0.23",
]

[project.scripts]
dessinopia = "dessinopia.app:main"

[project.urls]
Funding = "https://paypal.me/FlorianButel"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
